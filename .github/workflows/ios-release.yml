name: iOS Build & Upload to TestFlight

on:
  # Every push to main that touches the app builds and uploads a new TestFlight
  # build. The build number is resolved from App Store Connect, so no pubspec
  # bump is needed. Changes outside the app (README, server reference) do not
  # trigger a build; use "Run workflow" for those.
  push:
    branches:
      - main
    paths:
      - "morningfacts_mobile/**"
      - ".github/workflows/ios-release.yml"
  workflow_dispatch:
    inputs:
      build_name:
        description: "Version name (e.g. 1.0.3). Leave blank to resolve it automatically from pubspec.yaml + App Store Connect."
        required: false
        default: ""
      build_number:
        description: "Build number (e.g. 46). Leave blank to resolve it automatically from App Store Connect."
        required: false
        default: ""

# A newer push replaces a build that is still running, so TestFlight only gets
# the latest main and the macOS minutes are not spent on stale commits.
concurrency:
  group: morningfacts-ios-testflight
  cancel-in-progress: true

jobs:
  build-and-upload-ios:
    name: Build Flutter IPA and upload to TestFlight
    runs-on: macos-latest

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      # ── 2. Flutter ───────────────────────────────────────────────────────────
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.x"
          channel: stable
          cache: true

      - name: Install Flutter dependencies
        working-directory: morningfacts_mobile
        run: flutter pub get

      # ── 3. Code signing ──────────────────────────────────────────────────────
      # Secrets required (set in GitHub repo Settings → Secrets and variables → Actions):
      #   Optional: BUILD_CERTIFICATE_BASE64 + P12_PASSWORD + KEYCHAIN_PASSWORD.
      #   Without them the export uses Apple cloud signing with the Admin API key.

      - name: Import Distribution certificate
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          # Optional: without a .p12 the export uses Apple cloud signing
          # (needs an Admin API key), so no certificate secret is needed.
          if [ -z "${BUILD_CERTIFICATE_BASE64:-}" ]; then
            echo "No certificate secret - using cloud signing."
            exit 0
          fi
          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

          # Decode certificate
          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o "$CERTIFICATE_PATH"

          # Create a temporary keychain
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Import certificate into keychain
          security import "$CERTIFICATE_PATH" \
            -P "$P12_PASSWORD" \
            -A -t cert -f pkcs12 \
            -k "$KEYCHAIN_PATH"

          # Make keychain visible to codesign
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          security default-keychain -s "$KEYCHAIN_PATH"

          # Allow codesign tools to access the imported key in CI
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

      # No provisioning profile secret: Xcode creates and downloads the App
      # Store profile itself (-allowProvisioningUpdates + the App Store Connect
      # API key), and registers the bundle id if it does not exist yet.
      - name: Install App Store Connect API key
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_API_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
        run: |
          KEY_DIR="$HOME/.appstoreconnect/private_keys"
          mkdir -p "$KEY_DIR"
          # Accept the .p8 file pasted as-is, or base64 of it.
          if printf '%s' "$APP_STORE_CONNECT_API_KEY_P8" | grep -q "BEGIN PRIVATE KEY"; then
            printf '%s\n' "$APP_STORE_CONNECT_API_KEY_P8" > "$KEY_DIR/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"
          else
            echo -n "$APP_STORE_CONNECT_API_KEY_P8" | base64 --decode -o "$KEY_DIR/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"
          fi
          echo "ASC_KEY_PATH=$KEY_DIR/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8" >> $GITHUB_ENV

      # ── 3b. Resolve version ──────────────────────────────────────────────────
      # Asks App Store Connect which version/build numbers already exist and picks
      # the next free pair, so an unbumped pubspec.yaml can no longer fail the
      # upload with error 90062 ("must contain a higher version").
      - name: Resolve version and build number
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
          INPUT_BUILD_NAME: ${{ github.event.inputs.build_name }}
          INPUT_BUILD_NUMBER: ${{ github.event.inputs.build_number }}
          PUBSPEC_PATH: morningfacts_mobile/pubspec.yaml
        run: |
          # macOS runners ship a Homebrew python that refuses system-wide pip
          # installs (PEP 668), so install into a throwaway virtualenv.
          python3 -m venv "$RUNNER_TEMP/versionvenv"
          "$RUNNER_TEMP/versionvenv/bin/python" -m pip install --quiet --disable-pip-version-check pyjwt cryptography
          "$RUNNER_TEMP/versionvenv/bin/python" .github/workflows/scripts/resolve_version.py

      # ── 4. ExportOptions ─────────────────────────────────────────────────────
      # Tells Xcode to export for App Store Connect distribution.
      - name: Create ExportOptions.plist
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          cat > /tmp/ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>signingStyle</key>
            <string>automatic</string>
            <key>teamID</key>
            <string>${TEAM_ID}</string>
            <key>uploadBitcode</key>
            <false/>
            <key>uploadSymbols</key>
            <true/>
          </dict>
          </plist>
          EOF

      # ── 5. Build IPA ─────────────────────────────────────────────────────────
      - name: Build Flutter iOS (unsigned)
        working-directory: morningfacts_mobile
        env:
          REVENUECAT_APPLE_KEY: ${{ secrets.REVENUECAT_APPLE_KEY }}
        run: |
          # BUILD_NAME / BUILD_NUMBER come from the "Resolve version" step.
          echo "Building $BUILD_NAME ($BUILD_NUMBER)"

          if [ -z "${REVENUECAT_APPLE_KEY:-}" ]; then
            echo "::warning::REVENUECAT_APPLE_KEY not set - building without purchases (paywall shows but cannot buy)."
          fi

          flutter build ios --release --no-codesign \
            --build-name="$BUILD_NAME" \
            --build-number="$BUILD_NUMBER" \
            --dart-define=REVENUECAT_APPLE_KEY="$REVENUECAT_APPLE_KEY"

      - name: Archive and export signed IPA
        working-directory: morningfacts_mobile/ios
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          xcodebuild -workspace Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Runner.xcarchive" \
            archive \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Runner.xcarchive" \
            -exportOptionsPlist /tmp/ExportOptions.plist \
            -exportPath ../build/ios/ipa \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$APP_STORE_CONNECT_KEY_ID" \
            -authenticationKeyIssuerID "$APP_STORE_CONNECT_ISSUER_ID"

          IPA_PATH=$(find ../build/ios/ipa -name "*.ipa" | head -1)
          if [ -z "${IPA_PATH:-}" ]; then
            echo "No IPA file produced."
            exit 1
          fi


      # ── 6. Upload to TestFlight ───────────────────────────────────────────────
      # Secrets required:
      #   APP_STORE_CONNECT_KEY_ID      — Key ID from App Store Connect API key page
      #   APP_STORE_CONNECT_ISSUER_ID   — Issuer ID from App Store Connect API key page
      #   APP_STORE_CONNECT_API_KEY_P8  — the downloaded .p8 key file, pasted as-is (or base64 of it)

      - name: Upload IPA to TestFlight
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
        run: |
          set -euo pipefail

          # The key file was installed in "Install App Store Connect API key".

          IPA_PATH=$(find morningfacts_mobile/build/ios/ipa -name "*.ipa" | head -1)
          echo "Uploading: $IPA_PATH"

          # altool can exit 0 even when Apple rejects the build, so capture the
          # output and fail explicitly on any reported upload error.
          UPLOAD_LOG="$RUNNER_TEMP/altool-upload.log"
          set +e
          xcrun altool --upload-app \
            --type ios \
            --file "$IPA_PATH" \
            --apiKey "$APP_STORE_CONNECT_KEY_ID" \
            --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID" \
            --verbose 2>&1 | tee "$UPLOAD_LOG"
          ALTOOL_EXIT=${PIPESTATUS[0]}
          set -e

          if [ "$ALTOOL_EXIT" -ne 0 ] || grep -qiE "UPLOAD FAILED|Failed to upload package|ERROR:" "$UPLOAD_LOG"; then
            # Print what Apple actually said. The generic "bump the version"
            # advice used to stand in for every failure, which sent the reader
            # editing version numbers over problems that had nothing to do with
            # them.
            REASON=$(awk -F'"' '/description/ {print $(NF-1)}' "$UPLOAD_LOG" | sort -u | head -5)
            echo "::error::TestFlight upload failed as $BUILD_NAME ($BUILD_NUMBER)."
            if [ -n "${REASON:-}" ]; then
              echo "$REASON" | while read -r line; do echo "::error::$line"; done
            else
              echo "::error::No error description in the altool output; see the full log above."
            fi
            exit 1
          fi
          echo "Upload accepted by App Store Connect."

      # ── 7. Cleanup ───────────────────────────────────────────────────────────
      - name: Clean up keychain and API key
        if: always()
        run: |
          security delete-keychain $RUNNER_TEMP/app-signing.keychain-db || true
          rm -f "$HOME/.appstoreconnect/private_keys/AuthKey_${{ secrets.APP_STORE_CONNECT_KEY_ID }}.p8"
